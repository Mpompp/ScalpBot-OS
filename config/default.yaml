# =============================================================================
# ScalpBot Configuration
# =============================================================================
# All values shown are defaults. Uncomment and modify as needed.
# Environment variables with SCALP_ prefix override YAML values.

bot:
  symbol: "XAUUSDm"        # Exness Gold Mini/Standard commodity
  log_level: "info"        # Logging level: debug | info | warn | error

# -----------------------------------------------------------------------------
# Market Data
# -----------------------------------------------------------------------------
market_data:
  tick_buffer_size: 4096   # Ring buffer capacity (number of ticks)
  candle_period: 5m        # OHLCV aggregation period (M5 — Realistic for small accounts)
  tick_channel_buf: 1024   # Tick channel buffer size for pipeline

# -----------------------------------------------------------------------------
# Strategy: Momentum Scalper (Trend Hunter) — M5 Execution with H1 Macro Trend
# -----------------------------------------------------------------------------
strategy:
  timeframe: "M5"          # Primary strategy execution timeframe (5-Minute — optimal noise/spread balance)
  macro_timeframe: "H1"    # Higher timeframe macro trend confirmation (1-Hour institutional trend)
  fast_ema_period: 5       # Fast EMA lookback on M5 (= 25 minutes)
  slow_ema_period: 13      # Slow EMA lookback on M5 (= 65 minutes)
  rsi_period: 14           # RSI lookback
  atr_period: 14           # ATR lookback (also used by risk engine)
  rsi_overbought: 70.0     # RSI upper filter threshold
  rsi_oversold: 30.0       # RSI lower filter threshold
  atr_minimum: 0.35        # Minimum ATR for signal generation ($0.35 Gold M5 candle body)
  sl_atr_multiplier: 1.5   # Stop Loss = 1.5x ATR (min $2.50 floor)
  tp_atr_multiplier: 2.5   # Take Profit = 2.5x ATR (min $6.00 floor) -> RR 1:2.5
  min_vol_ratio: 0.60       # Dead-Market Filter (Nyao Scalper VolRatio >= 60% of baseline ATR)
  enable_limit_pullback: true # Discount Limit entry on breakout pullback (no buying the top)
  pullback_discount_atr: 0.30 # 0.3x ATR retracement depth before entry

# -----------------------------------------------------------------------------
# Strategy: Mean-Reversion Range Scalper (Asian / Sideways Session)
# -----------------------------------------------------------------------------
range_strategy:
  enabled: false           # DISABLED — Gold swing momentum mode: range scalper bypassed
  bollinger_period: 20     # Bollinger Band window
  bollinger_stddev: 2.0    # Standard deviations
  rsi_period: 14           # RSI lookback
  atr_period: 14           # ATR lookback
  rsi_overbought: 62.0     # Reversal sell trigger
  rsi_oversold: 38.0       # Reversal buy trigger
  min_tp_points: 1.50      # Minimum TP distance ($1.50 Gold)

# -----------------------------------------------------------------------------
# Risk Management (Calibrated for 900 USC Cent Account)
# -----------------------------------------------------------------------------
risk:
  initial_equity: 900.0    # Starting account balance: 900 USC (Cent Account)
  risk_per_trade: 0.005    # Conservative risk per trade (0.5% equity = ~4.5 USC)
  max_daily_drawdown: 0.05 # Max daily loss before circuit breaker trips (5% = 45 USC)
  daily_profit_target_pct: 0.05 # 5% daily profit target lock (Auto Anti-Greed)
  daily_profit_target_usd: 50.0 # 50.0 USC nominal target lock
  max_spread_pips: 60.0    # Maximum allowed spread for Gold (60 pips = $0.60)
  max_positions_per_symbol: 1 # Strict 1 position per symbol
  max_open_positions: 1    # Strict 1 position (Gold-exclusive focus)
  min_lot_size: 0.01       # Minimum position size
  max_lot_size: 0.01       # Strictly fixed safe 0.01 lot for 900 USC capital
  is_cent_account: true    # Cent account mode active
  min_tick_velocity_tps: 0.0 # Min ticks/sec
  max_tick_velocity_tps: 0.0 # Max ticks/sec

# -----------------------------------------------------------------------------
# Position Tracking & Trade Management — M5 Scalping (30m–45m trade horizon)
# -----------------------------------------------------------------------------
position:
  enable_trailing: true       # Master switch for trailing stop
  trailing_mode: "atr"        # ATR-based trailing — gives Gold swing room to breathe
  trailing_stop_pips: 150.0   # Fallback fixed trailing (150 pips = $1.50) if ATR unavailable
  trailing_atr_mult: 1.5      # ATR x1.5 trailing distance for M5 scalping
  enable_breakeven: true      # Master switch for break-even
  breakeven_pips: 500.0       # Move SL to entry after +$5.00 profit (500 pips)
  breakeven_buff_pips: 20.0   # Buffer above entry price for break-even SL (+$0.20 Gold)
  enable_profit_locker: true  # Multi-Stage Dynamic Profit Locker (Stage 1: BE, Stage 2: 50% Lock, Stage 3: 75% Lock)
  stage1_atr_mult: 1.5        # Stage 1 trigger threshold (1.5x ATR, min $5.00)
  stage2_atr_mult: 2.0        # Stage 2 trigger threshold (2.0x ATR, min $7.50)
  stage3_atr_mult: 2.8        # Stage 3 trigger threshold (2.8x ATR, min $10.50)
  enable_partial_tp: true     # Enable closing 50% lot at TP1 and letting remainder run
  partial_tp_ratio: 0.5       # Lot fraction to close at TP1 (0.5 = 50%)
  tp1_pips: 500.0             # Target pips for Partial TP1 ($5.00 = 500 pips)
  tp2_pips: 1000.0            # Final target pips for TP2 ($10.00 = 1000 pips)
  time_stop_duration: 45m     # Stagnant Trade Killer: auto-close if flat > 45 minutes (M5)

# -----------------------------------------------------------------------------
# Trading Session Filter — London + NY Overlap Only (Best for Gold M5/M15)
# -----------------------------------------------------------------------------
session:
  enabled: true            # Enable session-based trading restrictions
  sessions:                # Active sessions (only trade during these windows)
    - "london"             # 07:00-16:00 UTC (09:00-18:00 WIB)
    - "newyork"            # 12:00-21:00 UTC (14:00-23:00 WIB)
    - "overlap"            # 12:00-16:00 UTC (14:00-18:00 WIB) — Peak liquidity, lowest spread
    # - "asian"            # 23:00-08:00 UTC (01:00-10:00 WIB) — Disable for Gold due to chop

# -----------------------------------------------------------------------------
# Order Executor
# -----------------------------------------------------------------------------
executor:
  workers: 2               # Number of dispatcher worker goroutines
  queue_size: 32           # Order channel buffer size

# -----------------------------------------------------------------------------
# Broker Adapter
# -----------------------------------------------------------------------------
broker:
  type: "mt5"              # Broker type: "mock" | "mt5"
  # Mock Broker settings:
  fill_latency: 5ms        # Mock: simulated execution delay
  slippage_pct: 0.00005    # Mock: max slippage as fraction (~0.5 pips)
  reject_rate: 0.02        # Mock: order rejection probability (2%)
  # MT5 Broker settings (when type: "mt5"):
  mt5_command_addr: "127.0.0.1:5555" # MT5 EA Command port (REQ-REP)
  mt5_stream_addr: "127.0.0.1:5556"  # MT5 EA Tick Stream port (PUB)
  magic_number: 123456               # MT5 EA Magic Number
  slippage_points: 10                # MT5 Execution slippage (points)

# -----------------------------------------------------------------------------
# Alerting & Notifications
# -----------------------------------------------------------------------------
notifier:
  enable_log: true         # Log alerts to stdout (always recommended)
  webhook_url: ""          # HTTP webhook URL (empty = disabled)
  telegram_token: ""       # Telegram bot token (prefer env: SCALP_TG_TOKEN)
  telegram_chat: ""        # Telegram chat ID (prefer env: SCALP_TG_CHAT)
  enable_interactive_bot: true      # Enable 2-way Telegram polling & remote control (Inline Buttons)

# -----------------------------------------------------------------------------
# AI & Gaussian Hidden Markov Model (HMM) Decision Core — M5/M15 Intraday Swing
# -----------------------------------------------------------------------------
ai:
  enable_ml_filter: true        # Enable AI Gaussian HMM regime scoring
  dual_mode_enabled: false      # DISABLED for Gold M5/M15: Pure Trend mode (Range scalper causes whipsaws)
  min_confidence: 0.55          # Calibrated 55% composite ensemble threshold (Balanced mode default)
  range_min_confidence: 0.50    # 50% minimum confidence for Range setups (unused when dual_mode=false)
  filter_ranging_chop: true     # Block trend breakout trades during Noise/Chop state

# -----------------------------------------------------------------------------
# Multi-Symbol Portfolio & Risk Budgeting
# -----------------------------------------------------------------------------
portfolio:
  enable_correlation_guard: false  # Disabled (Single-commodity Gold focus)
  max_correlated_positions: 1      # Maximum concurrent positions
  volatility_parity_sizing: false  # Single-symbol Gold sizing (fixed safe 0.01 lot)

# -----------------------------------------------------------------------------
# Live Economic Calendar & News Auto-Blackout — Critical for Gold
# -----------------------------------------------------------------------------
news:
  enable_auto_sync: false          # Set true when live HTTP calendar URL is provided
  feed_url: ""                     # Economic calendar JSON feed URL
  sync_interval: 1h                # Periodic calendar refresh interval
  blackout_before: 30m             # Halt new orders 30 minutes before high-impact USD news (NFP, FOMC, CPI)
  blackout_after: 15m              # Halt new orders 15 minutes after high-impact news

# -----------------------------------------------------------------------------
# Real-Time Web Dashboard & Control Center
# -----------------------------------------------------------------------------
web:
  enabled: true                    # Enable local browser control dashboard
  host: "127.0.0.1"                # Listen IP
  port: 8080                       # Browser access port: http://127.0.0.1:8080
